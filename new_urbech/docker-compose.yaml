services:
  # --------------------
  # WebSocket signaling
  # --------------------
  signaling:
    image: node:20
    container_name: signaling
    working_dir: /app
    volumes:
      - /home/shamil/Node/AndroidBackendSignaling:/app
    command: node server.js
    environment:
      PORT: 8080
    networks: [appnet]
    restart: unless-stopped

  # --------------------
  # Database
  # --------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myshop}
      POSTGRES_USER: ${POSTGRES_USER:-myshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myshop_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myshop_user} -d ${POSTGRES_DB:-myshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------
  # Prisma migration
  # --------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:-myshop_password}@postgres:5432/${POSTGRES_DB:-myshop}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]
    restart: "no"

  # --------------------
  # Backend (FastAPI)
  # --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend_media:/app/app/media
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:-myshop_password}@postgres:5432/${POSTGRES_DB:-myshop}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://urbechov.ru}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks: [appnet]
    restart: unless-stopped

  # --------------------
  # Frontend (Next.js)
  # --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"
    depends_on:
      - backend
    networks: [appnet]
    restart: unless-stopped

  # --------------------
  # Caddy (reverse proxy)
  # --------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - signaling
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backend_media:
