services:
  # --------------------
  # WebSocket signaling
  # --------------------
  signaling:
    image: node:20
    container_name: signaling
    working_dir: /app
    volumes:
      - /home/shamil/Node/AndroidBackendSignaling:/app
      - signaling_data:/data
    command: node server.js
    environment:
      PORT: 8080
      NODE_ENV: production
      USERS_FILE: /data/users.json
      OFFLINE_MESSAGES_FILE: /data/offline_messages.json
    expose:
      - "8080"
    networks:
      - app_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:8080/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --------------------
  # Database
  # --------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myshop}
      POSTGRES_USER: ${POSTGRES_USER:-myshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myshop_user} -d ${POSTGRES_DB:-myshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------
  # Prisma migration
  # --------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-myshop}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # --------------------
  # Backend (FastAPI)
  # --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend_media:/app/app/media
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-myshop}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://urbechov.ru}
      WEBSOCKET_URL: wss://urbechov.ru/ws
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"
    networks:
      - app_net
      - db_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------
  # Frontend (Next.js)
  # --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_WS_URL: wss://urbechov.ru/ws
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------
  # Caddy (reverse proxy)
  # --------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      signaling:
        condition: service_healthy
    networks:
      - public_net
      - app_net
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  public_net:
  app_net:
    internal: true
  db_net:
    internal: true

volumes:
  postgres_data:
  backend_media:
  caddy_data:
  caddy_config:
  signaling_data:
