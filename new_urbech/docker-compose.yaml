services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myshop}
      POSTGRES_USER: ${POSTGRES_USER:-myshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myshop_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myshop_user} -d ${POSTGRES_DB:-myshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs prisma migrations (deploy) one time, then exits successfully
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:-myshop_password}@postgres:5432/${POSTGRES_DB:-myshop}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myshop_user}:${POSTGRES_PASSWORD:-myshop_password}@postgres:5432/${POSTGRES_DB:-myshop}

      # Auth / JWT
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS (set this properly in .env, example: https://yourdomain.com)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # Email (if you use it)
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [appnet]
    restart: unless-stopped

    # IMPORTANT: production run (no --reload)
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production

      # Browser should call your own domain through Caddy:
      # your code should use `${NEXT_PUBLIC_API_BASE}/...`
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    networks: [appnet]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
